name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ./dashboard
        run: npm ci
      - name: Typecheck
        working-directory: ./dashboard
        run: npm run typecheck
      - name: Lint
        working-directory: ./dashboard
        run: npm run lint
      - name: Test
        working-directory: ./dashboard
        run: npm test
      - name: Build
        working-directory: ./dashboard
        run: npm run build
      - name: Build container image
        run: |
          docker build -t orrery-dashboard:ci ./dashboard
      - name: Start container
        run: |
          docker run -d --name orrery-dashboard -p 3000:3000 orrery-dashboard:ci
          # Wait for container to be ready
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'; then
              echo "Container is ready"
              break
            fi
            sleep 1
          done
      - name: Run smoke script
        run: |
          ./scripts/smoke.sh http://127.0.0.1:3000
      - name: Stop container
        if: always()
        run: |
          docker stop orrery-dashboard
          docker rm orrery-dashboard
